[project]
name = "iqama"
version = "0.1.0"
description = "Prayer times, reminders, and a weekly prayer log for the system tray."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "plyer>=2.1.0",
    "win10toast-click>=0.1.2; sys_platform == 'win32'",
    "tzlocal>=5.2",
    "matplotlib>=3.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
iqama = "iqama.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
